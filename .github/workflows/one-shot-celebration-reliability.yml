name: One-shot celebration reliability patch

on:
  push:
    branches:
      - fix/celebration-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot celebration reliability patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/celebration-reliability
          fetch-depth: 0

      - name: Apply the reliability repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}; found {count}")
              return text.replace(old, new, 1)

          app_path = Path("app.js")
          css_path = Path("styles.css")
          index_path = Path("index.html")

          app = app_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")
          index = index_path.read_text(encoding="utf-8")

          app = replace_once(
              app,
              'const CONFETTI_PIECES_PER_SIDE = 420;\nconst CONFETTI_PIECES_PER_SIDE_MOBILE = 240;',
              'const CONFETTI_PIECES_PER_SIDE = 90;\nconst CONFETTI_PIECES_PER_SIDE_MOBILE = 45;',
              "confetti-count constants",
          )

          app = replace_once(
              app,
              '  dom.celebrationEnabled.addEventListener("change", handleCelebrationPreferenceChange);',
              '  dom.celebrationEnabled?.addEventListener("change", handleCelebrationPreferenceChange);',
              "celebration preference listener",
          )

          celebration_pattern = re.compile(
              r'function startSolutionCelebration\(optimization\) \{.*?\n\}\n\n'
              r'function handleCelebrationPreferenceChange\(\) \{.*?\n\}\n\n'
              r'function stopSolutionCelebration\(expectedRun = null\) \{.*?\n\}\n\n'
              r'(?=function buildConfettiSpecs)',
              re.DOTALL,
          )

          replacement = r'''function startSolutionCelebration(optimization) {
            stopSolutionCelebration();
            solutionCelebrationRun += 1;
            const currentRun = solutionCelebrationRun;

            if (dom.solutionAnnouncement) {
              dom.solutionAnnouncement.textContent = `Optimal solution found. ${optimization.message}`;
            }

            // The on-page checkbox is authoritative. A selected celebration must always
            // produce a visible result, even when motion is reduced or animation fails.
            const celebrationEnabled = dom.celebrationEnabled?.checked ?? true;
            if (!celebrationEnabled || !dom.solutionCelebration || !dom.solutionConfetti) {
              return;
            }

            let useStaticFallback = Boolean(
              window.matchMedia?.("(prefers-reduced-motion: reduce)").matches
            );
            const fragment = document.createDocumentFragment();

            if (!useStaticFallback) {
              try {
                const mobile = window.matchMedia?.("(max-width: 700px)").matches;
                const count = mobile ? CONFETTI_PIECES_PER_SIDE_MOBILE : CONFETTI_PIECES_PER_SIDE;

                ["left", "right", "top"].forEach((side) => {
                  buildConfettiSpecs({ side, count }).forEach((spec) => {
                    fragment.appendChild(createConfettiPiece(spec));
                  });
                });
              } catch (error) {
                useStaticFallback = true;
                console.warn("The animated celebration could not be prepared; showing the static celebration instead.", error);
              }
            }

            dom.solutionCelebration.dataset.state = "idle";
            dom.solutionCelebration.dataset.motion = useStaticFallback ? "reduced" : "full";
            dom.solutionConfetti.replaceChildren(fragment);

            if (useStaticFallback) {
              applyStaticSolutionCelebration();
            }

            // New particles are created for every run, so a forced layout read is not
            // necessary. Activating synchronously is more reliable on managed devices.
            dom.solutionCelebration.dataset.state = "active";

            solutionCelebrationTimer = window.setTimeout(() => {
              stopSolutionCelebration(currentRun);
            }, OPTIMUM_CELEBRATION_DURATION_MS);
          }

          function handleCelebrationPreferenceChange() {
            if (!dom.celebrationEnabled?.checked) {
              stopSolutionCelebration();
            }
          }

          function applyStaticSolutionCelebration() {
            const container = dom.solutionCelebration;
            if (!container) {
              return;
            }

            // Inline important declarations also defeat an older cached stylesheet that
            // hid the entire overlay for reduced-motion users.
            container.style.setProperty("display", "block", "important");
            container.style.setProperty("visibility", "visible", "important");

            const stage = container.querySelector(".lp-celebration-stage");
            if (stage) {
              stage.style.setProperty("animation", "none", "important");
              stage.style.setProperty("opacity", "1", "important");
              stage.style.setProperty("transform", "translate(-50%, -50%)", "important");
            }

            container.querySelectorAll(
              ".lp-celebration-title, .lp-happy-dancer__figure, .lp-happy-dancer__head-group, " +
              ".lp-happy-dancer__arm--left, .lp-happy-dancer__arm--right, " +
              ".lp-happy-dancer__leg--left, .lp-happy-dancer__leg--right, .lp-happy-dancer__spark"
            ).forEach((element) => {
              element.style.setProperty("animation", "none", "important");
            });
          }

          function clearStaticSolutionCelebration() {
            const container = dom.solutionCelebration;
            if (!container) {
              return;
            }

            container.style.removeProperty("display");
            container.style.removeProperty("visibility");

            const stage = container.querySelector(".lp-celebration-stage");
            if (stage) {
              stage.style.removeProperty("animation");
              stage.style.removeProperty("opacity");
              stage.style.removeProperty("transform");
            }

            container.querySelectorAll(
              ".lp-celebration-title, .lp-happy-dancer__figure, .lp-happy-dancer__head-group, " +
              ".lp-happy-dancer__arm--left, .lp-happy-dancer__arm--right, " +
              ".lp-happy-dancer__leg--left, .lp-happy-dancer__leg--right, .lp-happy-dancer__spark"
            ).forEach((element) => {
              element.style.removeProperty("animation");
            });
          }

          function stopSolutionCelebration(expectedRun = null) {
            if (expectedRun !== null && expectedRun !== solutionCelebrationRun) {
              return;
            }

            if (solutionCelebrationTimer !== null) {
              window.clearTimeout(solutionCelebrationTimer);
              solutionCelebrationTimer = null;
            }

            if (dom.solutionCelebration) {
              dom.solutionCelebration.dataset.state = "idle";
              delete dom.solutionCelebration.dataset.motion;
              clearStaticSolutionCelebration();
            }
            dom.solutionConfetti?.replaceChildren();
          }

          '''

          app, count = celebration_pattern.subn(replacement, app, count=1)
          if count != 1:
              raise SystemExit(f"Expected one celebration function block; found {count}")

          old_reduced_motion = '''@media (prefers-reduced-motion: reduce) {
            .lp-celebration {
              display: none !important;
            }
          }'''
          new_reduced_motion = '''/* A reduced-motion preference changes the celebration to a static success
          state; it must never suppress the success state completely. */
          .lp-celebration[data-motion="reduced"] .lp-confetti {
            display: none;
          }

          .lp-celebration[data-state="active"][data-motion="reduced"] .lp-celebration-stage {
            opacity: 1;
            transform: translate(-50%, -50%);
            animation: none !important;
          }

          .lp-celebration[data-motion="reduced"] .lp-celebration-title,
          .lp-celebration[data-motion="reduced"] .lp-happy-dancer__figure,
          .lp-celebration[data-motion="reduced"] .lp-happy-dancer__head-group,
          .lp-celebration[data-motion="reduced"] .lp-happy-dancer__arm--left,
          .lp-celebration[data-motion="reduced"] .lp-happy-dancer__arm--right,
          .lp-celebration[data-motion="reduced"] .lp-happy-dancer__leg--left,
          .lp-celebration[data-motion="reduced"] .lp-happy-dancer__leg--right,
          .lp-celebration[data-motion="reduced"] .lp-happy-dancer__spark {
            animation: none !important;
          }

          @media (prefers-reduced-motion: reduce) {
            .lp-celebration[data-state="active"] {
              visibility: visible;
            }
          }'''
          css = replace_once(css, old_reduced_motion, new_reduced_motion, "reduced-motion CSS block")

          asset_version = "celebration-reliable-20260904-v1"
          index = replace_once(
              index,
              './styles.css?v=20260904-confetti-storm',
              f'./styles.{asset_version}.css',
              "stylesheet asset reference",
          )
          index = replace_once(
              index,
              './app.js?v=20260904-confetti-storm',
              f'./app.{asset_version}.js',
              "script asset reference",
          )

          app_path.write_text(app, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          index_path.write_text(index, encoding="utf-8")
          Path(f"app.{asset_version}.js").write_text(app, encoding="utf-8")
          Path(f"styles.{asset_version}.css").write_text(css, encoding="utf-8")

          test_path = Path("tests/celebration-reliability.test.mjs")
          test_path.write_text(r'''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const app = readFileSync(new URL("../app.js", import.meta.url), "utf8");
          const css = readFileSync(new URL("../styles.css", import.meta.url), "utf8");
          const html = readFileSync(new URL("../index.html", import.meta.url), "utf8");

          test("a selected celebration always reaches a visible active state", () => {
            assert.match(app, /const celebrationEnabled = dom\.celebrationEnabled\?\.checked \?\? true/);
            assert.match(app, /dom\.solutionCelebration\.dataset\.state = "active"/);
            assert.doesNotMatch(app, /!dom\.celebrationEnabled\.checked \|\| prefersReducedMotion/);
          });

          test("reduced motion uses a static celebration rather than hiding it", () => {
            assert.match(app, /applyStaticSolutionCelebration\(\)/);
            assert.match(css, /data-motion="reduced"/);
            assert.doesNotMatch(css, /prefers-reduced-motion:[^}]+display:\s*none/is);
          });

          test("deployment uses path-level cache-busted assets", () => {
            assert.match(html, /app\.celebration-reliable-20260904-v1\.js/);
            assert.match(html, /styles\.celebration-reliable-20260904-v1\.css/);
          });

          test("the celebration avoids an excessive DOM storm", () => {
            assert.match(app, /CONFETTI_PIECES_PER_SIDE = 90/);
            assert.match(app, /CONFETTI_PIECES_PER_SIDE_MOBILE = 45/);
            assert.doesNotMatch(app, /CONFETTI_PIECES_PER_SIDE = 420/);
          });
          ''', encoding="utf-8")
          PY

      - name: Validate JavaScript and regression tests
        shell: bash
        run: |
          node --check app.js
          node --test tests/*.test.mjs

      - name: Commit the repaired implementation
        shell: bash
        run: |
          rm .github/workflows/one-shot-celebration-reliability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html tests/celebration-reliability.test.mjs \
            app.celebration-reliable-20260904-v1.js \
            styles.celebration-reliable-20260904-v1.css \
            .github/workflows/one-shot-celebration-reliability.yml
          git commit -m "Make optimum celebration reliable across browsers"
          git push origin HEAD:fix/celebration-reliability
